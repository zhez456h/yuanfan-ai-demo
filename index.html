<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>远帆 AI｜外贸销售执行官</title>
  <link rel="stylesheet" href="styles.css?v=33" />
<link rel="stylesheet" href="additional.css?v=100" />
<script src="demo.js"></script></head>
<body>
  <a class="skip-main skip-link" href="#main">跳到主要内容</a>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><path d="M3 15h18l-2.6-8H5.6z"/><path d="M3 15v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M7 17h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-product" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></symbol>
    <symbol id="i-company" viewBox="0 0 24 24"><path d="M4 21V5l9-2v18M13 9h7v12M8 8h1M8 12h1M8 16h1M16 13h1M16 17h1M2 21h20"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-5 3.4-7 8-7s7.2 2 8 7"/></symbol>
    <symbol id="i-deal" viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h5M9 13h6M9 17h5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v6l4 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16m0 0-4-4m4 4 4-4M16 20V4m0 0-4 4m4-4 4 4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 17v3h16v-3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 18-8-7 18-3-7zM11 14 21 3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.8a7 7 0 0 0 0-3.6l2-1.6-2-3.4-2.5 1A7 7 0 0 0 13.8 4L13.5 1h-4L9.2 4a7 7 0 0 0-2.7 2.2l-2.5-1-2 3.4 2 1.6a7 7 0 0 0 0 3.6l-2 1.6 2 3.4 2.5-1A7 7 0 0 0 9.2 20l.3 3h4l.3-3a7 7 0 0 0 2.7-2.2l2.5 1 2-3.4z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
  </svg>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand-row">
        <button class="brand" data-route="new-task" aria-label="远帆 AI 外贸销售执行官">
          <span class="brand-mark"><svg class="ico"><use href="#i-spark"/></svg></span>
          <span><b>远帆</b><small>AI外贸销售执行官</small></span>
        </button>
        <button class="ghost-icon" id="collapse-sidebar" aria-label="折叠侧边栏"><svg class="ico"><use href="#i-menu"/></svg></button>
      </div>

      <nav class="primary-nav">
        <button class="nav-item nav-create active" data-route="new-task"><svg class="ico"><use href="#i-plus"/></svg><span>新建任务</span></button>
        <button class="nav-item" data-route="dashboard"><svg class="ico"><use href="#i-home"/></svg><span>仪表盘</span></button>
        <button class="nav-item" data-route="mail"><svg class="ico"><use href="#i-mail"/></svg><span>邮件</span></button>
        <button class="nav-item" data-route="tasks"><svg class="ico"><use href="#i-task"/></svg><span>成果</span></button>
        <button class="nav-item" data-route="drive"><svg class="ico"><use href="#i-drive"/></svg><span>云盘</span></button>
        <button class="nav-item" id="more-toggle" aria-expanded="false" aria-controls="more-nav" hidden><svg class="ico"><use href="#i-grid"/></svg><span>更多</span><svg class="ico arrow"><use href="#i-chevron"/></svg></button>
      </nav>

      <nav class="more-nav" id="more-nav" aria-label="更多业务模块" hidden>
        <button class="nav-item" data-route="products"><svg class="ico"><use href="#i-product"/></svg><span>商品</span></button>
        <button class="nav-item" data-route="companies"><svg class="ico"><use href="#i-company"/></svg><span>客户库</span></button>
        <button class="nav-item" data-route="people"><svg class="ico"><use href="#i-person"/></svg><span>联系人</span></button>
        <button class="nav-item" data-route="opportunities"><svg class="ico"><use href="#i-deal"/></svg><span>商机</span></button>
        <button class="nav-item" data-route="quotations"><svg class="ico"><use href="#i-quote"/></svg><span>报价</span></button>
        <button class="nav-item" data-route="samples"><svg class="ico"><use href="#i-product"/></svg><span>样品</span></button>
        <button class="nav-item" data-route="orders"><svg class="ico"><use href="#i-task"/></svg><span>订单</span></button>
      </nav>

      <div class="conversation-block">
        <div class="conversation-head">
          <button class="plain-button" id="conversation-toggle" aria-expanded="true" aria-controls="conversation-list">所有任务 <span>⌄</span></button>
          <div><button class="mini-icon" id="conversation-sort" aria-label="排序历史任务"><svg class="ico"><use href="#i-sort"/></svg></button><button class="mini-icon" data-route="history" aria-label="历史记录"><svg class="ico"><use href="#i-history"/></svg></button></div>
        </div>
        <div class="conversation-list" id="conversation-list">
          <button data-route="research-task" class="conversation active"><span>美国东方地毯背调</span><svg class="ico dots"><use href="#i-dots"/></svg></button>
          <button data-route="mail-setup-task" class="conversation"><span>设置企业邮箱</span><i class="unread-dot"></i></button>
          <button data-route="lead-task" class="conversation"><span>德国储能分销商名单</span></button>
        </div>
      </div>

      <div class="sidebar-foot">
        <button class="user-card" id="user-menu-button" aria-expanded="false" aria-controls="user-menu">
          <span class="avatar" id="user-avatar">Z</span><span><b id="user-display-name">者着</b><small id="user-workspace-label">体验工作区</small></span><span class="plan-badge">本地版</span>
        </button>
        <div class="user-menu" id="user-menu" role="menu">
          <div class="user-menu-head"><span class="avatar">Z</span><span><b id="menu-user-name">者着</b><small id="menu-user-email">demo@yuanfan.local</small></span></div>
          <button role="menuitem" data-action="login" id="auth-action">登录与安全</button><button role="menuitem" data-action="logout" id="logout-action" hidden>退出登录</button><button role="menuitem" data-action="settings"><svg class="ico"><use href="#i-settings"/></svg>设置</button><button role="menuitem" data-action="help">帮助与反馈</button>
        </div>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1"><h1 class="sr-only">远帆 AI 外贸销售执行官</h1></main>
  </div>

  <button class="mobile-menu" id="mobile-menu" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar"><svg class="ico"><use href="#i-menu"/></svg></button>
  <button class="help-fab" id="help-fab"><svg class="ico"><use href="#i-spark"/></svg><span><b>帮助</b><small>本地使用指南</small></span></button>
  <div class="sr-only" id="route-announcer" aria-live="polite" aria-atomic="true"></div>

  <div class="modal-layer" id="modal-layer" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><div><h2 id="modal-title">设置</h2><p id="modal-subtitle">管理个人与组织设置</p></div><button class="ghost-icon" data-close-modal aria-label="关闭"><svg class="ico"><use href="#i-close"/></svg></button></header>
      <div id="modal-content"></div>
    </div>
  </div>

  <div class="command-layer" id="command-layer" aria-hidden="true">
    <div class="command-box" role="dialog" aria-label="全局搜索">
      <div class="command-input"><svg class="ico"><use href="#i-search"/></svg><input id="command-input" aria-label="全局搜索" placeholder="搜索客户、邮件、商机或 AI 会话" /></div>
      <div class="command-results" id="command-results"></div>
      <small class="command-hint">↑↓ 选择　Enter 打开　Esc 关闭</small>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="global-file" hidden multiple />
  <script src="app.js?v=98"></script>
</body>
</html>
